<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>監査勉強サイト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#eee4d2; --parchment:#e6d9c1; --walnut:#231a10; --walnut-soft:#4a3a28;
    --brass:#b8934f; --brass-bright:#e2c07f; --burgundy:#6b2b30; --ink:#2a2119;
    --shadow:rgba(15,10,4,0.5);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:"Shippori Mincho",serif;background:#0c0906;color:var(--ink);overflow-x:hidden;}

  /* ============ GATE ============ */
  #gate{ position:fixed; inset:0; z-index:100; overflow:hidden; transition:opacity .6s ease; perspective:1400px; }
  #gate.opened{ pointer-events:none; }
  #gate.hidden{ opacity:0; }
  #gate-bg{ position:absolute; inset:0; background:#0c0906; transition:opacity 1s ease 2s; }
  #gate.opened #gate-bg{ opacity:0; }
  #gate-bg::after{
    content:""; position:absolute; inset:0;
    background:radial-gradient(circle at 50% 44%, rgba(226,192,127,0) 0%, rgba(0,0,0,0.5) 70%);
  }

  .leaf{ position:absolute; top:0; bottom:0; width:50%; background-size:cover; transition: transform 2.3s cubic-bezier(.45,0,.2,1); z-index:3; }
  .leaf-l{ left:0; background-position:right center; box-shadow:10px 0 34px rgba(0,0,0,0.55); transform-origin:left center; background-color:#1a130c; }
  .leaf-r{ right:0; background-position:left center; box-shadow:-10px 0 34px rgba(0,0,0,0.55); transform-origin:right center; background-color:#1a130c; }
  #gate.opened .leaf-l{ transform:rotateY(-42deg); }
  #gate.opened .leaf-r{ transform:rotateY(42deg); }
  #gate.hidden .leaf{ opacity:0; transition:opacity .4s ease; }

  .seam-glow{
    position:absolute; inset:0; left:50%; width:0; transform:translateX(-50%);
    background:radial-gradient(ellipse 38% 40% at 50% 52%, rgba(255,255,252,0.95) 0%, rgba(255,250,238,0.55) 32%, rgba(255,250,238,0) 72%);
    opacity:0; z-index:2; pointer-events:none;
    transition:opacity .5s ease, width 1.4s cubic-bezier(.3,0,.2,1);
    filter:blur(26px);
  }
  #gate.opened .seam-glow{ opacity:1; width:1400px; transition:opacity .4s ease .2s, width 2s cubic-bezier(.4,0,.2,1) .2s; }

  .whiteout{
    position:absolute; inset:0; background:#fdfaf3; opacity:0; z-index:4; pointer-events:none;
    transition:opacity .7s ease;
  }
  #gate.opened .whiteout{ opacity:1; transition:opacity 1s ease 1.5s; }
  #gate.hidden .whiteout{ opacity:0; transition:opacity 1.6s ease .4s; }
  #gate.hidden .seam-glow{ opacity:0; transition:opacity .3s ease; }
  #gate.hidden #gate-bg{ opacity:0; transition:opacity .3s ease; }

  .dust{ position:absolute; border-radius:50%; background:rgba(226,192,127,0.55); pointer-events:none; filter:blur(0.5px); animation:drift linear infinite; z-index:4; }
  @keyframes drift{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    10%{ opacity:0.7; } 90%{ opacity:0.5; }
    100%{ transform:translateY(-140px) translateX(18px); opacity:0; }
  }

  .gate-inner{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); text-align:center; color:#efe3c8; width:min(88vw,400px); padding:0 20px; z-index:5; transition:opacity .5s ease; }
  #gate.opened .gate-inner{ opacity:0; }
  .gate-title{ font-family:"Cormorant Garamond",serif; font-style:italic; font-size:14px; letter-spacing:0.18em; color:#c9a35a; margin:0 0 22px; }
  .gate-warning{ font-size:13px; line-height:2.1; color:#d8cba8; margin:0 0 30px; letter-spacing:0.02em; text-shadow:0 2px 10px rgba(0,0,0,0.7); }
  .gate-warning strong{ color:#f1e2bb; font-weight:500; }

  .gate-form{ display:flex; flex-direction:column; align-items:center; gap:16px; }
  #pw{
    width:100%; max-width:230px; background:rgba(10,7,3,0.45); border:none; border-bottom:1px solid #7a6440;
    color:#f1e2bb; font-family:"Cormorant Garamond",serif; font-size:22px; letter-spacing:0.5em; text-align:center;
    padding:10px 4px; outline:none; backdrop-filter:blur(2px);
  }
  #pw:focus{ border-bottom-color:#e2c07f; }
  #pw::placeholder{ color:#6b5a3d; letter-spacing:0.2em; font-size:12.5px; }
  .gate-btn{
    margin-top:4px; background:none; border:1px solid #7a6440; color:#e2c07f; font-family:"Shippori Mincho",serif;
    font-size:12.5px; letter-spacing:0.22em; padding:11px 32px; cursor:pointer; transition:border-color .25s,color .25s,background .25s;
  }
  .gate-btn:hover{ border-color:#e2c07f; background:rgba(226,192,127,0.08); }
  .gate-error{ font-size:11.5px; color:#c9787c; min-height:16px; letter-spacing:0.08em; }

  /* ============ GALLERY ============ */
  #gallery{ background:var(--ivory); min-height:100vh; }
  .g-hero{
    position:relative; height:min(42vh,340px); min-height:220px; overflow:hidden;
    background-color:#2a2119; background-size:cover; background-position:center 40%;
  }
  .g-hero::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(10,7,3,0.05) 0%, rgba(10,7,3,0.18) 68%, var(--ivory) 100%);
  }
  .g-hero-text{ position:absolute; left:0; right:0; bottom:26px; text-align:center; z-index:2; padding:0 24px; }
  .g-eyebrow{ font-family:"Cormorant Garamond",serif; font-style:italic; font-size:13px; color:#e2c07f; letter-spacing:0.18em; margin:0 0 8px; text-shadow:0 2px 12px rgba(0,0,0,0.6); }
  .g-title{ font-weight:600; font-size:clamp(22px,3.4vw,32px); color:#fbf3de; margin:0; letter-spacing:0.06em; text-shadow:0 3px 18px rgba(0,0,0,0.55); }

  .g-body{ max-width:1040px; margin:0 auto; padding:24px 28px 40px; }
  .g-note{ max-width:480px; margin:0 auto 20px; text-align:center; font-size:12px; line-height:1.9; color:var(--walnut-soft); opacity:0.85; }

  .grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; align-items:stretch; }
  @media (max-width:760px){ .grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:480px){ .grid{ grid-template-columns:1fr; } }
  .card{
    background:var(--parchment); border:1px solid rgba(35,26,16,0.18); padding:18px 20px; cursor:pointer;
    position:relative; overflow:hidden; transition:transform .35s ease, box-shadow .35s ease, border-color .35s ease;
    height:132px; display:flex; flex-direction:column; justify-content:center;
  }
  .card::before{ content:""; position:absolute; inset:6px; border:1px solid rgba(184,147,79,0.4); pointer-events:none; }
  .card::after{
    content:""; position:absolute; top:-60%; left:50%; width:220%; height:220%; transform:translateX(-50%);
    background:radial-gradient(ellipse at 50% 0%, rgba(255,244,214,0.55) 0%, rgba(255,244,214,0) 55%);
    opacity:0; transition:opacity .4s ease; pointer-events:none;
  }
  .card:hover{ transform:translateY(-4px); border-color:var(--brass); box-shadow:0 18px 30px -18px var(--shadow); }
  .card:hover::after{ opacity:1; }
  .card-label{ font-family:"Cormorant Garamond",serif; font-style:italic; font-size:11.5px; color:var(--brass); letter-spacing:0.12em; margin:0 0 6px; position:relative; z-index:1; }
  .card-title{ font-size:16px; font-weight:600; color:var(--walnut); line-height:1.5; margin:0; position:relative; z-index:1;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .card-badge{
    position:absolute; top:10px; right:10px; z-index:1; font-family:"Cormorant Garamond",serif; font-style:italic;
    font-size:10.5px; color:var(--burgundy); background:rgba(255,255,255,0.55); border:1px solid rgba(107,43,48,0.35);
    padding:2px 8px; letter-spacing:0.06em;
  }

  /* ============ PANEL ============ */
  #panel-overlay{ position:fixed; inset:0; background:rgba(12,9,6,0.6); display:none; align-items:flex-start; justify-content:center; padding:56px 20px; overflow-y:auto; z-index:80; }
  #panel-overlay.show{ display:flex; }
  .panel{ background:var(--parchment); max-width:600px; width:100%; padding:40px 36px 36px; position:relative; border:1px solid rgba(35,26,16,0.25); }
  .panel::before{ content:""; position:absolute; inset:9px; border:1px double rgba(184,147,79,0.5); pointer-events:none; }
  .panel-close{ position:absolute; top:14px; right:18px; background:none; border:none; font-size:20px; color:var(--walnut-soft); cursor:pointer; font-family:serif; z-index:2; }
  .panel-eyebrow{ font-family:"Cormorant Garamond",serif; font-style:italic; font-size:13px; color:var(--brass); margin:0 0 6px; }
  .panel-title{ font-size:21px; font-weight:600; color:var(--walnut); margin:0 0 22px; padding-bottom:16px; border-bottom:1px solid rgba(35,26,16,0.2); }
  .panel-section{ margin-bottom:20px; }
  .panel-section h4{ font-size:11.5px; letter-spacing:0.1em; color:var(--burgundy); margin:0 0 8px; font-weight:600; }
  .panel-section ul{ margin:0; padding-left:18px; font-size:13.5px; line-height:1.9; color:var(--ink); }
  .panel-section.links{ background:rgba(184,147,79,0.12); border:1px solid rgba(184,147,79,0.35); padding:14px 16px; }
  .panel-section.links h4{ color:var(--brass-bright); filter:brightness(0.7); }
  .panel-section.links ul{ padding-left:16px; }
  .panel-section.links li{ margin-bottom:6px; word-break:break-all; }
  .panel-section.links a{ color:var(--burgundy); text-decoration:underline; }
  .panel-section.links .path{ font-family:monospace; font-size:11.5px; color:var(--walnut-soft); }
  .panel-section.links .note{ font-size:11.5px; color:var(--walnut-soft); font-style:italic; }
</style>
</head>
<body>

  <div id="gate">
    <div id="gate-bg"></div>
    <div class="leaf leaf-l"></div>
    <div class="leaf leaf-r"></div>
    <div class="seam-glow"></div>
    <div class="whiteout"></div>
    <div class="gate-inner">
      <p class="gate-title">confidential entrance</p>
      <p class="gate-warning">この先は<strong>努力をするもののみ進むことができる。</strong><br>努力できる者のみ、管理者よりパスワードを受け取れ。</p>
      <div class="gate-form">
        <input type="password" id="pw" placeholder="P A S S W O R D" inputmode="numeric" maxlength="12">
        <button class="gate-btn" onclick="tryOpen()">扉を開く</button>
        <div class="gate-error" id="err"></div>
      </div>
    </div>
  </div>
  <div id="gallery">
    <div class="g-hero">
      <div class="g-hero-text">
        <p class="g-eyebrow">quality audit — preparation</p>
        <h1 class="g-title">監査勉強サイト</h1>
      </div>
    </div>
    <div class="g-body">
      <p class="g-note">カードをクリックすると、チェック項目・キーポイント・資料リンクが表示されます。</p>
      <div class="grid" id="grid"></div>
    </div>
  </div>

  <div id="panel-overlay" onclick="if(event.target===this) close_()">
    <div class="panel">
      <button class="panel-close" onclick="close_()">×</button>
      <p class="panel-eyebrow">exhibit</p>
      <h3 class="panel-title" id="p-title"></h3>
      <div class="panel-section"><h4>チェック項目</h4><ul id="p-check"></ul></div>
      <div class="panel-section"><h4>キーポイント</h4><ul id="p-key"></ul></div>
      <div class="panel-section links" id="p-links-wrap" style="display:none;"><h4>資料リンク・保存先</h4><ul id="p-links"></ul></div>
    </div>
  </div>

<script>
const PASSWORD = "230804";

const items = [
  { title:"人材獲得競争",

    key:["SLS/SLDの内容・構造を説明してしまっていないか","媒体を開き、指差し「ここにこう書いてある通り」と言っているか","積木は難しい話をしていないか。積木パートはコンパクト・インパクト","必要性を自身の言葉で積木で（自身の経験範囲で）話せるか"],

    ] },
  { title:"お客様の言葉",
    check:["色々教えてもらって助かったよ…だけ","●〇のやり方がわかったよ…だけ","これは大切だね、必要だね","●〇にも伝えておくよ"],

    key:["お客様をみているか","担当ご家族の中で安全基準を満たしていない会員様を把握しているか","安全基準を満たしていない会員様をほったらかしなど「〇〇ぱなし」にしていないか","会員、一般の方へ当社の見解とご協力のお願いをお伝えできているか（紙をお預けしている等）"] },
  { title:"教養携帯要件（仲間獲得）～1204「社長の約束」～",

    key:["4/1カンファレンス1次情報インプット状況"],

      {label:"2025.12.04_新ビジネスモデル・新規事業発表会", path:"\\\\192.168.101.7\\マスター\\■店舗開示\\総合リレーション\\2025.12.04_新ビジネスモデル・新規事業発表会"}
    ],
    linksNote:"※社内共有サーバー（192.168.101.7）内のフォルダです。社内ネットワークからアクセスしてください。" },

    check:["教養携帯（構造要約書＋pcd2.0映像）※会員様にお渡しする要約書に自身の書込みがあること"],
    key:["会場を手ぶらで歩いていない"],
    links:[
      {label:"2026.04.01_Structure2030カンファレンス／予習資料（お知らせP3に記載）", path:"\\\\192.168.101.7\\マスター\\■店舗開示\\総合リレーション\\2026.04.01_Structure2030カンファレンス\\予習資料_お知らせP3に記載"},
      {label:"pcd2.0映像", path:"三島ポータル　監査メニュー"}
    ],
    linksNote:"※社内共有サーバー（192.168.101.7）内のフォルダです。社内ネットワークからアクセスしてください。" },

    ],

    check:["視聴有無","内容をアウトプット"],
    key:["視聴した・していない","キーワードがどれ位アウトプットできるか"],
    links:[
      {label:"コード集）資料映像集（042526資料）.pdf", path:"\\\\192.168.101.7\\マスター\\■店舗開示\\総合リレーション\\2026.04.25_26_スマートライフ学入門\\当日教材_資料\\受講生手元に用意\\コード集）資料映像集　(042526資料).pdf"}
    ],
    linksNote:"※社内共有サーバー（192.168.101.7）内のフォルダです。社内ネットワークからアクセスしてください。" },

    check:["1.ロープレ評価（410、VR、3術、枠）","2.BOXが商品説明になっていないか","3.直近1ヶ月の枠軒数実績"],
    key:["1.事前評価：3術、ご家族背景、必要性、M410、枠","2.BOXが商品説明になっていないか","3.直近1ヶ月の枠軒数実績"] }
];

const grid = document.getElementById('grid');
items.forEach((it,i)=>{
  const card=document.createElement('div');
  card.className='card';
  const badge = it.links ? '<span class="card-badge">資料あり</span>' : '';
  card.innerHTML=`${badge}<p class="card-label">exhibit ${String(i+1).padStart(2,'0')}</p><p class="card-title">${it.title}</p>`;
  card.onclick=()=>open_(it);
  grid.appendChild(card);
});
function open_(it){
  document.getElementById('p-title').textContent=it.title;
  document.getElementById('p-check').innerHTML=it.check.map(c=>`<li>${c}</li>`).join('');
  document.getElementById('p-key').innerHTML=it.key.map(k=>`<li>${k}</li>`).join('');
  const wrap=document.getElementById('p-links-wrap');
  const list=document.getElementById('p-links');
  if(it.links && it.links.length){
    list.innerHTML = it.links.map(l=>{
      if(l.url){
        return `<li>${l.label}：<a href="${l.url}" target="_blank" rel="noopener">${l.url}</a></li>`;
      }
      return `<li>${l.label}：<br><span class="path">${l.path}</span></li>`;
    }).join('') + (it.linksNote ? `<li class="note">${it.linksNote}</li>` : '');
    wrap.style.display='block';
  } else {
    wrap.style.display='none';
  }
  document.getElementById('panel-overlay').classList.add('show');
}
function close_(){ document.getElementById('panel-overlay').classList.remove('show'); }

const gate = document.getElementById('gate');
for(let i=0;i<22;i++){
  const d=document.createElement('div');
  d.className='dust';
  const size=1+Math.random()*2.5;
  d.style.width=size+'px'; d.style.height=size+'px';
  d.style.left=(10+Math.random()*80)+'%';
  d.style.bottom=(Math.random()*40)+'%';
  d.style.animationDuration=(6+Math.random()*8)+'s';
  d.style.animationDelay=(Math.random()*8)+'s';
  gate.appendChild(d);
}

function tryOpen(){
  const val=document.getElementById('pw').value.trim();
  const err=document.getElementById('err');
  if(val===PASSWORD){
    err.textContent='';
    gate.classList.add('unlocking');
    setTimeout(()=>{
      gate.classList.add('opened');
    }, 400);
    setTimeout(()=>{
      gate.classList.add('hidden');
    }, 3200);
    setTimeout(()=>{
      gate.style.display='none';
    }, 4800);
  } else {
    err.textContent='パスワードが違います';
    document.getElementById('pw').value='';
  }
}
document.getElementById('pw').addEventListener('keydown', e=>{ if(e.key==='Enter') tryOpen(); });
</script>
